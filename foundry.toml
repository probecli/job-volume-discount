[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Sandbox: no shell access, no filesystem access, no env reads from cases.
ffi = false
fs_permissions = []
# Pinned snapshot: every case runs at this exact block and time.
block_number = 5200000
block_timestamp = 1767830400
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
]
